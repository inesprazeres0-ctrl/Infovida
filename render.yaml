services:
  - type: web
    name: infovida
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: infovida-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/infovida.sqlite