services:
  - type: web
    name: infovida
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: infovida-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: infovida-db
    plan: free
    databaseName: infovida
    user: infovida